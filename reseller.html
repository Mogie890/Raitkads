<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseller Login</title>
<style>body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#1e293b;padding:30px;border-radius:12px;width:90%;max-width:380px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}</style>
</head><body>
<div class="card"><h2>Reseller Login</h2><p style="font-size:13px;color:#94a3b8">Login with Shop Name & Password</p><input id="shopName" placeholder="Shop Name"><input id="password" type="password" placeholder="Password"><button onclick="doLogin()">Login to Orders</button><p id="msg"></p><p style="font-size:12px;margin-top:15px"><a href="adminlogin.html" style="color:#94a3b8">Admin Login</a></p></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzTaiPH47zsnGbkSEHlPet72XrfZIvjmTdGirhS4tWLcj-tNhpSz5otG5k6_61UDZ-W_A/exec";
async function doLogin(){
  const shopName=document.getElementById('shopName').value.trim();
  const password=document.getElementById('password').value.trim();
  const msg=document.getElementById('msg');
  if(!shopName||!password){msg.innerText='Fill all';return;}
  msg.innerText='Checking...';
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'login',shopName,password})});
    const data=await res.json();
    if(data.status==='success'){localStorage.setItem('resellerShop',JSON.stringify(data.shop));location.href='reseller-orders.html';}
    else msg.innerText='Invalid Shop Name or Password';
  }catch(e){msg.innerText='Error connecting';}
}
</script></body></html>
