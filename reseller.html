<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseller Login - RaitKad</title>
<style>
body{background:#1a1d29;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#2a2d3e;padding:30px;border-radius:12px;width:90%;max-width:400px;text-align:center}
h2{color:#f0c040}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#1a1d29;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:disabled{opacity:0.5}
.msg{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>Reseller Login</h2>
<input id="shop" placeholder="Shop Name">

<input id="pwd" type="password" placeholder="Password">
<button id="btn" onclick="loginReseller()">LOGIN</button>
<div id="msg" class="msg"></div>
<div style="margin-top:15px;font-size:11px;opacity:0.6">
Ira Tauna: 67576001713 / 1713<br>
M2N Morgan: 67576001714 / 1234<br>
M2N Shong Lee: 67576800123 / 908070
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCTcgifcozrnb6Qd7FF7LCUHSwnolFTPT7Dlz6DHJkKtqQX1Fdvw0e8Zok6H2absOQzw/exec";
let shops=[];

function jsonp(url){
 return new Promise((resolve,reject)=>{
   const cb="cb"+Date.now();
   window[cb]=d=>{resolve(d);delete window[cb];s.remove();};
   const s=document.createElement("script");
   s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
   s.onerror=()=>{reject("load fail");delete window[cb];s.remove();};
   setTimeout(()=>reject("timeout"),15000);
   document.body.appendChild(s);
 });
}

async function loadShops(){
  try{
    document.getElementById("msg").textContent="Loading shops...";
    const data=await jsonp(SCRIPT_URL+"?type=getShops");
    shops=data;
    document.getElementById("msg").textContent="Ready - "+(data.length-1)+" shops";
    console.log("Shops loaded",data);
  }catch(e){
    document.getElementById("msg").textContent="❌ Sheet load failed: "+e+" - check SCRIPT_URL";
    console.error(e);
  }
}

async function loginReseller() {
  const shopInput = document.getElementById("shopName").value.trim();
  const passInput = document.getElementById("password").value.trim();
  if(!shopInput || !passInput) { alert("Enter shop & password"); return; }
  
  const url = `${SCRIPT_URL}?action=login&shop=${encodeURIComponent(shopInput)}&password=${encodeURIComponent(passInput)}&callback=cb`;
  
  // JSONP login
  window.cb = function(res) {
    if(res.status === "success") {
      localStorage.setItem("currentShop", JSON.stringify(res.shop));
      alert(;
      window.location.href = "dashboard.html"; // or show dashboard
    } else {
      alert(res.message);
    }
  };
  
  const s = document.createElement("script");
  s.src = url;
  document.body.appendChild(s);
}

// Load shops for dropdown
function loadShops() {
  const url = `${SCRIPT_URL}?action=getShops&callback=shopsCb`;
  window.shopsCb = function(shops) {
    console.log("Shops loaded:", shops);
    // fill dropdown if you have one
  };
  const s = document.createElement("script");
  s.src = url;
  document.body.appendChild(s);
}

loadShops();
</script>
</body>
</html>
