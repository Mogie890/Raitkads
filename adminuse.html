<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAIT Admin - Reseller Management</title>
<style>body{font-family:sans-serif;background:#f5f7fb;margin:0;padding:12px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:16px}input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer}.green{background:#22c55e;color:#fff;width:100%}.blue{background:#3b82f6;color:#fff}.dark{background:#111827;color:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}</style>
</head>
<body>
<div class="card">
<h3>A. Register New Reseller</h3>
<div class="row"><input id="shopName" placeholder="Shop Name *"><input id="owner" placeholder="Owner Name *"></div>
<div class="row"><input id="phone" placeholder="Phone / WhatsApp *"><input id="location" placeholder="Location *"></div>
<input id="password" placeholder="Password *" style="max-width:49%">
<button class="green" id="btnReg" onclick="register()">Register & Send WhatsApp</button>
<div id="msgA" style="margin-top:8px;color:#16a34a;font-weight:700"></div>
</div>

<div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center"><h3>B. Customer List View</h3>
<div><input id="q" placeholder="Search shop, owner, phone..." style="width:200px;display:inline-block"><button class="blue" onclick="exportCSV()">Extract Excel (CSV)</button> <button class="dark" onclick="loadShops()">Refresh</button></div>
</div>
<table><thead><tr><th>ShopName</th><th>Owner</th><th>Phone</th><th>Location</th><th>Password</th><th>Date Registered</th></tr></thead><tbody id="tbody"><tr><td colspan=6>Loading...</td></tr></tbody></table>
<div id="msgB"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTaiPH47zsnGbkSEHlPet72XrfZIvjmTdGirhS4tWLcj-tNhpSz5otG5k6_61UDZ-W_A/exec";
let allShops=[];

async function register(){
 const btn=document.getElementById('btnReg');
 const data={action:"createShop", shopName:shopName.value.trim(), owner:owner.value.trim(), phone:phone.value.trim(), location:location.value.trim(), password:password.value.trim()};
 if(!data.shopName||!data.owner||!data.phone||!data.location||!data.password){alert("Fill all");return;}
 btn.disabled=true; btn.textContent="Creating...";
 try{
   const res=await fetch(SCRIPT_URL,{method:"POST", body:JSON.stringify(data)});
   const j=await res.json();
   if(j.status==="success"){msgA.textContent="✅ Registered! Date auto-saved."; loadShops(); if(data.phone){window.open(`https://wa.me/${data.phone.replace(/[^0-9]/g,'')}?text=Welcome ${data.shopName}! Your login: ${data.shopName} / ${data.password}`,'_blank');} shopName.value=owner.value=phone.value=location.value=password.value="";}
   else msgA.textContent="❌ "+j.message;
 }catch(e){msgA.textContent="❌ Error: "+e.message;}
 btn.disabled=false; btn.textContent="Register & Send WhatsApp";
}

async function loadShops(){
 tbody.innerHTML="<tr><td colspan=6>Loading...</td></tr>";
 try{
   const res=await fetch(SCRIPT_URL+"?action=getShops");
   const shops=await res.json();
   allShops=shops;
   render(shops);
 }catch(e){tbody.innerHTML="<tr><td colspan=6>Error loading - check deployment: "+e.message+"</td></tr>";}
}

function render(list){
 if(!list.length){tbody.innerHTML="<tr><td colspan=6>No data</td></tr>";return;}
 tbody.innerHTML=list.map(s=>`<tr><td>${s.shopName}</td><td>${s.owner}</td><td>${s.phone}</td><td>${s.location}</td><td>${s.password}</td><td>${new Date(s.date).toLocaleString()}</td></tr>`).join('');
}

q.addEventListener('input',()=>{const v=q.value.toLowerCase(); render(allShops.filter(s=> (s.shopName+s.owner+s.phone+s.location).toLowerCase().includes(v)));});

function exportCSV(){
 if(!allShops.length){alert("No data");return;}
 let csv="ShopName,Owner,Phone,Location,Password,Date Registered\n";
 csv+=allShops.map(s=>`"${s.shopName}","${s.owner}","${s.phone}","${s.location}","${s.password}","${s.date}"`).join("\n");
 const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob);
 const a=document.createElement("a"); a.href=url; a.download="Raitkads_Customers_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
}

loadShops();
</script>
</body>
</html>
