<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Resellers</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0}header{background:#0f172a;color:white;padding:15px;display:flex;justify-content:space-between} .container{padding:20px;max-width:1100px;margin:auto} .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:20px}
input{padding:10px;margin:6px 0;border-radius:8px;border:1px solid #cbd5e1;width:100%;box-sizing:border-box}button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:bold} .btn-green{background:#22c55e;color:white} .btn-blue{background:#3b82f6;color:white} .btn-dark{background:#0f172a;color:white}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}th{background:#f8fafc}
</style>
</head><body>
<header><span>RAIT Admin - Reseller Management</span><button onclick="logout()" style="background:#ef4444;color:white">Logout</button></header>
<div class="container">
  <div class="card"><h3>A. Register New Reseller</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <input id="shopName" placeholder="Shop Name *"><input id="owner" placeholder="Owner Name *">
      <input id="phone" placeholder="Phone / WhatsApp *"><input id="location" placeholder="Location *">
      <input id="password" placeholder="Password *" type="text">
    </div>
    <button class="btn-green" onclick="createShop()" style="margin-top:12px;width:100%">Register & Send WhatsApp</button><p id="createMsg"></p>
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h3>B. Customer List View</h3>
    <div><input id="search" placeholder="Search shop, owner, phone..." onkeyup="filterTable()" style="width:200px"><button class="btn-blue" onclick="exportExcel()" style="margin-left:8px">Extract Excel (CSV)</button><button class="btn-dark" onclick="loadShops()">Refresh</button></div></div>
    <div style="overflow:auto"><table id="shopTable"><thead><tr><th>ShopName</th><th>Owner</th><th>Phone</th><th>Location</th><th>Password</th><th>Date Registered</th></tr></thead><tbody></tbody></table></div><p id="count"></p>
  </div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTaiPH47zsnGbkSEHlPet72XrfZIvjmTdGirhS4tWLcj-tNhpSz5otG5k6_61UDZ-W_A/exec";
if(!localStorage.getItem('isAdmin')) location.href='adminlogin.html';
let allShops=[];
async function createShop(){
  const shopName=document.getElementById('shopName').value.trim();
  const owner=document.getElementById('owner').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const location=document.getElementById('location').value.trim();
  const password=document.getElementById('password').value.trim();
  const msg=document.getElementById('createMsg');
  if(!shopName||!owner||!phone||!location||!password){alert('Fill all');return;}
  msg.innerText='Creating...';
  const payload={action:'createShop',shopName,owner,phone,location,password};
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    msg.innerHTML='<span style="color:green">✅ Registered! Date auto-saved.</span>';
    const text=`Welcome ${shopName}!%0AOwner: ${owner}%0APhone: ${phone}%0APassword: ${password}%0ALocation: ${location}%0A%0ALogin: https://mogie890.github.io/Raitkads/reseller.html`;
    setTimeout(()=>{window.open(`https://wa.me/${phone.replace(/[^0-9]/g,'')}?text=${text}`,'_blank');loadShops();},800);
    document.getElementById('shopName').value='';document.getElementById('owner').value='';document.getElementById('phone').value='';document.getElementById('location').value='';document.getElementById('password').value='';
  }catch(e){msg.innerHTML='<span style="color:red">Error but may be saved. Refresh.</span>';loadShops();}
}
async function loadShops(){
  try{
    const res=await fetch(SCRIPT_URL+'?action=getShops');
    const data=await res.json();
    allShops=data; renderTable(data);
  }catch(e){document.getElementById('count').innerText='Error loading - check deployment';}
}
function renderTable(list){
  const tbody=document.querySelector('#shopTable tbody'); tbody.innerHTML='';
  list.forEach(s=>{
    const tr=document.createElement('tr'); const d=s.date?new Date(s.date).toLocaleString():'';
    tr.innerHTML=`<td>${s.shopName}</td><td>${s.owner}</td><td>${s.phone}</td><td>${s.location}</td><td>${s.password}</td><td>${d}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('count').innerText=`Total: ${list.length} resellers`;
}
function filterTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=allShops.filter(s=>(s.shopName+s.owner+s.phone+s.location).toLowerCase().includes(q));
  renderTable(filtered);
}
function exportExcel(){
  if(!allShops.length){alert('No data');return;}
  let csv='ShopName,Owner,Phone,Location,Password,DateRegistered\n';
  allShops.forEach(s=>{csv+=`"${s.shopName}","${s.owner}","${s.phone}","${s.location}","${s.password}","${s.date}"\n`;});
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='resellers_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function logout(){localStorage.removeItem('isAdmin');location.href='adminlogin.html';}
loadShops();
</script></body></html>
