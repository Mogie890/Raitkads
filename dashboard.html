<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - RaitKad</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px}
.top{background:#1e293b;padding:10px 15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.card{background:#1e293b;padding:15px;border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#fbbf24;padding:8px;text-align:left;border-bottom:1px solid #334155}
td{padding:8px;border-bottom:1px solid #1e293b}
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:bold}
.btn-green{background:#22c55e;color:#fff}
.btn-gray{background:#334155;color:#fff}
#debug{background:#000;color:#0f0;padding:10px;border-radius:5px;font-size:11px;margin-bottom:10px;white-space:pre-wrap;max-height:200px;overflow:auto}
</style>
</head>
<body>
<div class="top">
<span id="loginInfo">Loading...</span>
<div><button class="btn btn-gray" onclick="location.href='reseller.html?logout=1'">Logout</button></div>
</div>

<div class="card">
<div id="debug">Loading orders...</div>
<h3 style="margin:0 0 10px">📦 My Past Orders - RaitKad</h3>
<button class="btn btn-green" onclick="goNewOrder()">+ New Order</button>
<button class="btn btn-gray" onclick="location.href='reseller.html?logout=1'" style="margin-left:5px">Logout</button>
<div style="margin-top:15px;overflow-x:auto">
<table id="orderTable"><thead><tr><th>Date</th><th>Shop</th><th>K3</th><th>K5</th><th>K10</th><th>K20</th><th>K30</th><th>K50</th><th>Total (K)</th><th>Status</th></tr></thead><tbody id="tbody"><tr><td colspan="10">Loading...</td></tr></tbody></table>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTaiPH47zsnGbkSEHlPet72XrfZIvjmTdGirhS4tWLcj-tNhpSz5otG5k6_61UDZ-W_A/exec";

function getParam(name){
  let url=new URL(window.location.href);
  return url.searchParams.get(name);
}
let urlPhone=getParam('phone');
let urlShop=getParam('shop');
let shopName=localStorage.getItem('shopName')||urlShop||'';
let shopPhone=localStorage.getItem('phone')||localStorage.getItem('shopPhone')||urlPhone||'';
if(urlPhone){ localStorage.setItem('phone',urlPhone); shopPhone=urlPhone; }
if(urlShop){ localStorage.setItem('shopName',urlShop); shopName=urlShop; }
document.getElementById('loginInfo').innerHTML='✅ Logged in as: <b>'+shopName+'</b> | '+shopPhone;

function goNewOrder(){
  location.href='neworder.html?phone='+encodeURIComponent(shopPhone)+'&shop='+encodeURIComponent(shopName)+'&t='+Date.now();
}

function jsonp(type){
  return new Promise((resolve)=>{
    let cb='cb_'+type+'_'+Date.now();
    window[cb]=function(data){ try{delete window[cb]}catch(e){} let el=document.getElementById('jsonp_'+type); if(el) el.remove(); resolve(data); };
    let s=document.createElement('script'); s.id='jsonp_'+type;
    s.src=SCRIPT_URL+'?type='+type+'&callback='+cb+'&t='+Date.now();
    s.onerror=()=>resolve(null);
    document.body.appendChild(s);
  });
}

    return;

      if(v.replace(/\D/g,'').length>=7) rPhone=v; // likely phone
      if(v.replace(/\D/g,'').includes(cleanMyPhone) && cleanMyPhone.length>=4){
        rPhone=v; break;
      }
    }
    let cleanRowPhone=rPhone.replace(/\D/g,'').slice(-8);
    let matchPhone=cleanMyPhone && cleanRowPhone && cleanMyPhone===cleanRowPhone;
    let matchShop=shopName && rowStr.includes(shopName.toLowerCase());
    // If filtering fails, show all that contain my phone anywhere in row
    let matchAny=rowStr.includes(cleanMyPhone) || rowStr.includes(shopPhone.toLowerCase()) || (shopName && rowStr.includes(shopName.toLowerCase()));

    if(matchPhone || matchShop || matchAny){
      count++;
      let tr=document.createElement('tr');
      // Expect order row: Date, Shop, K3, K5, K10, K20, K30, K50, Total, Status, Phone...
      // Build cells
