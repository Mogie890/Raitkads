<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:#1e293b;padding:30px;border-radius:12px;width:90%;max-width:350px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="card"><h2>Admin Login</h2><input id="user" placeholder="Username (admin)"><input id="pass" type="password" placeholder="Password (admin123)"><button onclick="login()">Login</button><p id="msg"></p></div>
<script>
function login(){
  const u=document.getElementById('user').value;
  const p=document.getElementById('pass').value;
  if(u==='admin' && p==='admin123'){localStorage.setItem('isAdmin','true');location.href='adminuse.html';}
  else document.getElementById('msg').innerText='Invalid - Use admin / admin123';
}
</script></body></html>
