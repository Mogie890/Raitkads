<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{font-family:Arial;background:#0d47a1;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:25px;border-radius:10px;width:90%;max-width:320px;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0d47a1;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
</style></head><body>
<div class="box"><h2>Telikom Admin</h2>
<input id="user" placeholder="Username" value="admin">
<input id="pass" type="password" placeholder="Password" value="Telikom2025">
<button onclick="login()">LOGIN</button>
<p style="font-size:12px;color:#666;margin-top:10px">Enter Username and Password</p>
</div>
<script>
function login(){
var u=document.getElementById('user').value;
var p=document.getElementById('pass').value;
if(u==='admin' && p==='Telikom2025'){
localStorage.setItem('admin','yes');
location.href='adminuse.html';
}else{alert('Wrong! Use admin / Telikom2025');}
}
</script></body></html>
