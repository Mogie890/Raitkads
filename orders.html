<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telikom Raitkad - Order</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:12px;margin:0;}
h2{margin:10px 0;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.box{background:white;color:black;border-radius:10px;padding:10px;}
.box b{font-size:14px;}
.box input{width:100%;border:none;font-size:16px;margin-top:4px;outline:none;background:transparent;}
.card{background:#1e293b;padding:15px;border-radius:12px;}
.card input, .card select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box;font-size:14px;}
.total{font-weight:bold;margin:8px 0;font-size:18px;}
.btn{width:100%;background:#22c55e;color:black;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px;}
.topbar{color:#22c55e;font-size:13px;margin-bottom:10px;}
</style>
</head>
<body>

<h2>📱 Telikom Raitkad</h2>
<div class="topbar" id="shopInfo">Loading...</div>

<div class="grid">
<div class="box"><b>K3</b><br><input id="k3" type="number" min="0" value="0" oninput="calc()"></div>
<div class="box"><b>K5</b><br><input id="k5" type="number" min="0" value="0" oninput="calc()"></div>
<div class="box"><b>K10</b><br><input id="k10" type="number" min="0" value="0" oninput="calc()"></div>
<div class="box"><b>K20</b><br><input id="k20" type="number" min="0" value="0" oninput="calc()"></div>
<div class="box"><b>K50</b><br><input id="k50" type="number" min="0" value="0" oninput="calc()"></div>
<div class="box"><b>K100</b><br><input id="k100" type="number" min="0" value="0" oninput="calc()"></div>
</div>

<div class="card">
<div class="total" id="total">Total: K0</div>

<input id="shopName" placeholder="Shop Name">
<input id="location" placeholder="Location - e.g. Erima, Crane Street">

<select id="salesRep">
<option value="">-- Select Your Sales Rep --</option>
<option value="67576001490">Kapaka Iga - 76001490</option>
<option value="67576001277">Kagai Nibabe - 76001277</option>
<option value="67576001713">Kule Gabina - 76001713</option>
<option value="67576001044">Joshua Wani - 76001044</option>
<option value="67576001712">Moses Vavine - 76001712</option>
<option value="67576001438">Pehaytch Bovaro - 76001438</option>
<option value="Telikom Admin">Telikom Admin</option>
</select>

<button class="btn" onclick="sendOrder()">Send Order via WhatsApp</button>
<button style="width:100%;background:#334155;color:white;padding:12px;border:none;border-radius:8px;margin-top:8px;" onclick="location.href='dashboard.html'">← Dashboard</button>

<p id="msg" style="text-align:center;margin-top:10px;"></p>
</div>

<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbzF2sCq-EhdIX-deQXzHN_pHkINy6xEsckGhU54YM106lbS-fFb0xAB11stHa9sZAFv_A/exec";
const shop = localStorage.getItem("currentShop") || "";
if(!shop){ location.href="index.html"; }
document.getElementById("shopInfo").innerText="✅ "+shop+" | Port Moresby";
document.getElementById("shopName").value = shop;

let totalK=0;
function calc(){
  const k3=parseInt(document.getElementById("k3").value)||0;
    const k5=parseInt(document.getElementById("k5").value)||0;
      const k10=parseInt(document.getElementById("k10").value)||0;
        const k20=parseInt(document.getElementById("k20").value)||0;
          const k50=parseInt(document.getElementById("k50").value)||0;
            const k100=parseInt(document.getElementById("k100").value)||0;
              totalK = (k3*3)+(k5*5)+(k10*10)+(k20*20)+(k50*50)+(k100*100);
                document.getElementById("total").innerText="Total: K"+totalK;
                }

                function sendOrder(){
                  const k3=document.getElementById("k3").value||0;
                    const k5=document.getElementById("k5").value||0;
                      const k10=document.getElementById("k10").value||0;
                        const k20=document.getElementById("k20").value||0;
                          const k50=document.getElementById("k50").value||0;
                            const k100=document.getElementById("k100").value||0;
                              const shopName=document.getElementById("shopName").value;
                                const loc=document.getElementById("location").value;
                                  const rep=document.getElementById("salesRep").value;

                                    if(totalK==0){ alert("Add at least one Raitkad!"); return; }
                                      if(!loc || !rep){ alert("Fill location and Sales Rep"); return; }

                                        // Save to Google Sheet
                                          const cb="cb_"+Date.now();
                                            window[cb]=function(r){
                                                delete window[cb]; script.remove();
                                                  };
                                                    const script=document.createElement("script");
                                                      script.src=`${SHEET_URL}?type=order&shop=${encodeURIComponent(shopName)}&custPhone=${encodeURIComponent(loc)}&product=${encodeURIComponent(`K3:${k3} K5:${k5} K10:${k10} K20:${k20} K50:${k50} K100:${k100}`)}&amount=${totalK}&callback=${cb}`;
                                                        document.body.appendChild(script);

                                      
                                                

  // Get selected rep number + name
    const repSelect = document.getElementById("salesRep");
      let repNumber = repSelect.value;
        let repName = repSelect.options[repSelect.selectedIndex].text;
          
            if(!repNumber || repNumber=="Telikom Admin"){
                repNumber = "67576001490"; // fallback to Kapaka Iga if Admin selected
                    repName = "Telikom Admin";
                      }

                        // WhatsApp message
    // Build only items with qty > 0
        let orderLines = [];
            if(k3>0) orderLines.push(`K3 x ${k3} = K${k3*3}`);
                if(k5>0) orderLines.push(`K5 x ${k5} = K${k5*5}`);
                    if(k10>0) orderLines.push(`K10 x ${k10} = K${k10*10}`);
                        if(k20>0) orderLines.push(`K20 x ${k20} = K${k20*20}`);
                            if(k50>0) orderLines.push(`K50 x ${k50} = K${k50*50}`);
                                if(k100>0) orderLines.push(`K100 x ${k100} = K${k100*100}`);
                                    const orderText = orderLines.join("%0A");

                                        const msg = `*TELIKOM RAITKAD ORDER*%0A%0A*Shop:* ${shopName}%0A*Location:* ${loc}%0A*Sales Rep:* ${repName}%0A%0A*Order:*%0A${orderText}%0A%0A*TOTAL: K${totalK}*%0A%0AThank you!`;
                            
                              window.open(`https://wa.me/${repNumber}?text=${msg}`, "_blank");
                                                                      document.getElementById("msg").innerText="✅ Order sent! Saved to sheet.";
                                                                      }
                                                                      calc();
                                                                      </script>
                                                                      </body>
                                                                      </html>
