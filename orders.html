<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseller Orders</title>
<style>body{font-family:Arial;background:#f1f5f9;margin:0}header{background:#0f172a;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}.container{padding:20px;max-width:900px;margin:auto}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:20px}input,textarea,select{padding:10px;margin:6px 0;border-radius:8px;border:1px solid #cbd5e1;width:100%;box-sizing:border-box}button{padding:12px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}.btn-green{background:#22c55e;color:white;width:100%}.btn-dark{background:#0f172a;color:white}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}</style>
</head><body>
<header><span id="welcome">Orders</span><button onclick="logout()" style="background:#ef4444;color:white">Logout</button></header>
<div class="container">
  <div class="card"><h3>Place New Order</h3><input id="product" placeholder="Product Name * (e.g 20kg Rice)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="qty" type="number" placeholder="Qty *"><select id="unit"><option>pcs</option><option>kg</option><option>bags</option><option>cartons</option></select></div><textarea id="notes" placeholder="Notes (optional)"></textarea><button class="btn-green" onclick="placeOrder()">Submit Order</button><p id="orderMsg"></p></div>
  <div class="card"><h3>My Orders</h3><button class="btn-dark" onclick="loadMyOrders()">Refresh</button><div style="overflow:auto;margin-top:10px"><table id="orderTable"><thead><tr><th>OrderID</th><th>Product</th><th>Qty</th><th>Date</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzTaiPH47zsnGbkSEHlPet72XrfZIvjmTdGirhS4tWLcj-tNhpSz5otG5k6_61UDZ-W_A/exec";
const shop=JSON.parse(localStorage.getItem('resellerShop')||'null'); if(!shop) location.href='reseller.html';
document.getElementById('welcome').innerText=shop.shopName+' - Orders';
async function placeOrder(){
  const product=document.getElementById('product').value.trim();
  const qty=document.getElementById('qty').value.trim();
  const unit=document.getElementById('unit').value;
  const notes=document.getElementById('notes').value.trim();
  const msg=document.getElementById('orderMsg');
  if(!product||!qty){alert('Product & Qty required');return;}
  msg.innerText='Placing...';
  const payload={action:'createOrder',shopName:shop.shopName,owner:shop.owner,phone:shop.phone,location:shop.location,product:product+' ('+unit+')',qty,notes};
  try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});msg.innerHTML='<span style="color:green">✅ Order Placed! Date auto-saved</span>';document.getElementById('product').value='';document.getElementById('qty').value='';document.getElementById('notes').value='';setTimeout(loadMyOrders,1000);}catch(e){msg.innerText='Error but order may be saved.';}
}
async function loadMyOrders(){
  try{
    const res=await fetch(SCRIPT_URL+'?action=getOrders'); const data=await res.json();
    const my=data.filter(o=>o.shopName.toLowerCase()===shop.shopName.toLowerCase());
    const tbody=document.querySelector('#orderTable tbody'); tbody.innerHTML='';
    my.reverse().forEach(o=>{const tr=document.createElement('tr'); const d=o.date?new Date(o.date).toLocaleString():''; tr.innerHTML=`<td>${o.orderId}</td><td>${o.product}</td><td>${o.qty}</td><td>${d}</td><td>${o.status}</td>`; tbody.appendChild(tr);});
  }catch(e){}
}
function logout(){localStorage.removeItem('resellerShop');location.href='reseller.html';}
loadMyOrders();
</script></body></html>
